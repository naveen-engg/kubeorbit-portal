# KubeOrbit cluster topology.
#
# Copy this file to clusters.yaml (or point KUBEORBIT_CONFIG_PATH at a copy
# elsewhere) and fill in real project/account/subscription identifiers.
# Nothing sensitive belongs in this file -- it is cluster *coordinates*
# (project IDs, regions, resource group names), never credentials. Actual
# secrets (service account keys, AWS credentials, Azure client secrets) come
# from environment variables -- see .env.example.
#
# Structure: teams -> environments (sandbox | nonprod | prod) -> clusters.
# Each cluster picks a `provider` (gke | eks | aks) and a `config` block whose
# keys are interpreted by that provider's adapter in providers/<provider>.py.

teams:
  - id: platform
    name: Platform Engineering
    environments:
      - id: sandbox
        clusters:
          - id: platform-sandbox-gke
            name: platform-sandbox
            provider: gke
            environment: sandbox
            description: Scratch cluster for platform team experiments
            config:
              project: my-gcp-project-sandbox
              region: us-central1
              # zone: us-central1-a          # use zone instead of region for zonal clusters
              # cluster_name: platform-sbx    # defaults to `name` above if omitted
              # impersonate_service_account: kubeorbit-reader@my-gcp-project-sandbox.iam.gserviceaccount.com

      - id: nonprod
        clusters:
          - id: platform-nonprod-eks
            name: platform-nonprod
            provider: eks
            environment: nonprod
            config:
              region: us-west-2
              cluster_name: platform-nonprod
              role_arn: arn:aws:iam::111122223333:role/kubeorbit-platform-nonprod
              # aws_profile: platform-nonprod   # optional named profile for local dev

          - id: platform-nonprod-aks
            name: platform-nonprod
            provider: aks
            environment: nonprod
            config:
              resource_group: platform-nonprod-rg
              cluster_name: platform-nonprod
              subscription_id: 00000000-0000-0000-0000-000000000000
              # service_principal_env_prefix: "PLATFORM_NONPROD_"  # reads
              #   PLATFORM_NONPROD_AZURE_CLIENT_ID / _SECRET / _TENANT_ID

      - id: prod
        clusters:
          - id: platform-prod-gke
            name: platform-prod
            provider: gke
            environment: prod
            config:
              project: my-gcp-project-prod
              region: us-central1
              impersonate_service_account: kubeorbit-reader@my-gcp-project-prod.iam.gserviceaccount.com

          - id: platform-prod-eks
            name: platform-prod
            provider: eks
            environment: prod
            config:
              region: us-west-2
              cluster_name: platform-prod
              role_arn: arn:aws:iam::111122223333:role/kubeorbit-platform-prod

          - id: platform-prod-aks
            name: platform-prod
            provider: aks
            environment: prod
            config:
              resource_group: platform-prod-rg
              cluster_name: platform-prod
              subscription_id: 00000000-0000-0000-0000-000000000000
              service_principal_env_prefix: "PLATFORM_PROD_"

  - id: data
    name: Data Platform
    environments:
      - id: sandbox
        clusters:
          - id: data-sandbox-gke
            name: data-sandbox
            provider: gke
            environment: sandbox
            config:
              project: my-gcp-project-sandbox
              zone: us-central1-a

      - id: prod
        clusters:
          - id: data-prod-aks
            name: data-prod
            provider: aks
            environment: prod
            config:
              resource_group: data-prod-rg
              cluster_name: data-prod
              subscription_id: 11111111-1111-1111-1111-111111111111
              service_principal_env_prefix: "DATA_PROD_"

# Global runtime settings. All optional -- shown here at their defaults.
settings:
  excluded_namespace_patterns:
    - kube-system
    - kube-public
    - kube-node-lease
    - "gke-managed*"
    - gmp-system
    - "azure-*"
    - "eks-*"
    - "amazon-*"
    - kubernetes-dashboard
  default_refresh_interval_seconds: 30
  allowed_refresh_intervals_seconds: [15, 30, 60, 120]
  kube_cache_ttl_seconds: 15          # pods/services/etc: changes often
  cluster_meta_cache_ttl_seconds: 120 # node pools/version/helm: changes rarely
  auth_cache_ttl_seconds: 600         # how long a kubectl context is trusted before re-auth
  cli_timeout_seconds: 45             # per kubectl/helm/gcloud/aws/az invocation
  # Tried in order (first match wins) to group workloads/services/pods into
  # a logical "application" on the Applications view. Add your org's own
  # convention (e.g. "team", "service") ahead of the defaults if you don't
  # use the app.kubernetes.io/* labels.
  app_correlation_label_keys:
    - app.kubernetes.io/part-of
    - app.kubernetes.io/name
    - app
    - tier
