# 16. Step 11 Scenario: kubelet Readiness Probe Failure (Container Running, but 0/1 Ready)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-unready
  namespace: kubeorbit-demo
  labels:
    app.kubernetes.io/name: inventory-unready
    app.kubernetes.io/part-of: kubeorbit-demo
    app: inventory-unready
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-unready
  template:
    metadata:
      labels:
        app: inventory-unready
        tier: backend
        app.kubernetes.io/name: inventory-unready
        app.kubernetes.io/part-of: kubeorbit-demo
    spec:
      containers:
      - name: inventory-api
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=Inventory Service Listening on 8080"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9099
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 1
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
---
