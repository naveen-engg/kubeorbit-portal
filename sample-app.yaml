# 15. Step 10a Scenario: kubelet CSI Mount Failure (Scheduled to node, stuck in ContainerCreating)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-shipper-csi
  namespace: kubeorbit-demo
  labels:
    app.kubernetes.io/name: audit-shipper-csi
    app.kubernetes.io/part-of: kubeorbit-demo
    app: audit-shipper-csi
    tier: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-shipper-csi
  template:
    metadata:
      labels:
        app: audit-shipper-csi
        tier: security
        app.kubernetes.io/name: audit-shipper-csi
        app.kubernetes.io/part-of: kubeorbit-demo
    spec:
      containers:
      - name: shipper
        image: busybox:1.36
